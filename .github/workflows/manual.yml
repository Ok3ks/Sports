# This is a basic workflow that is manually triggered

name: Participants entry

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  schedule: 
    - cron:  '15 * * * *'
    
  workflow_dispatch:
    inputs:
      name:
        description: 'Endpoint to Scrap'
        default: 'Scrap Participants Entry'
        required: true
        type: string
env:
      GW: 1
      START: 1
      END: 10000

jobs:
  scrap:
    # Allow the job to fetch a GitHub ID token
    permissions:
      id-token: write
      contents: read

    runs-on: ubuntu-latest
      
    steps:
      - id: 'checkout'
        uses: 'actions/checkout@v4'
        with: 
          ref: docker-production-sqlite

      
      - name: "update start & end"
        if: ${{ github.event.schedule == '* 2 * * * *' }}
        run: |
          START=10000
          END=30000
          echo START=$START >> $GITHUB_ENV
          echo END=$END >> $GITHUB_ENV
          
      - name: "update start & end"
        if: ${{ github.event.schedule == '* 3 * * * *' }}
        run: |
          START=30000
          END=50000
          echo START=$START >> $GITHUB_ENV
          echo END=$END >> $GITHUB_ENV
          
      - name: "update start & end"
        if: ${{ github.event.schedule == '* 4 * * * *' }}
        run: |
          START=50000
          END=70000
          echo START=$START >> $GITHUB_ENV
          echo END=$END >> $GITHUB_ENV

      - name: "update start & end"
        if: ${{ github.event.schedule == '* 5 * * * *' }}
        run: |
          START=70000
          END=90000
          echo START=$START >> $GITHUB_ENV
          echo END=$END >> $GITHUB_ENV

      - name: "update start & end"
        if: ${{ github.event.schedule == '* 7 * * * *' }}
        run: |
          START=90000
          END=1100000
          echo START=$START >> $GITHUB_ENV
          echo END=$END >> $GITHUB_ENV

      - name: "update start & end"
        if: ${{ github.event.schedule == '* 8 * * * *' }}
        run: |
          START=1100000
          END=1300000
          echo START=$START >> $GITHUB_ENV
          echo END=$END >> $GITHUB_ENV
          
      - name: "update start & end"
        if: ${{ github.event.schedule == '* 9 * * * *' }}
        run: |
          START=1300000
          END=1500000
          echo START=$START >> $GITHUB_ENV
          echo END=$END >> $GITHUB_ENV
          
      - name: "update start & end"
        if: ${{ github.event.schedule == '* 11 * * * *' }}
        run: |
          START=1500000
          END=1700000
          echo START=$START >> $GITHUB_ENV
          echo END=$END >> $GITHUB_ENV

      - name: "update start & end"
        if: ${{ github.event.schedule == '* 12 * * * *' }}
        run: |
          START=1700000
          END=1900000
          echo START=$START >> $GITHUB_ENV
          echo END=$END >> $GITHUB_ENV

      - name: "update start & end"
        if: ${{ github.event.schedule == '* 12 * * * *' }}
        run: |
          START=1900000
          END=2100000
          echo START=$START >> $GITHUB_ENV
          echo END=$END >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "LiveProject/.python-version"

      # - name: Create virtualenv
      #   run: |
      #     which python
      #     python -m venv venv
      #     source venv/bin/activate
      #     pip install -r LiveProject/requirements.txt
      #     which python
    
      - name: 'Scrap Weekly Entry'
        run: |
            source venv/bin/activate
            source init_env.sh
            cd LiveProject
            echo ${{ env.START }}.json
            touch  ${{ env.START }}.json
            echo ${{ github.event.schedule }}
            # python src/db/write_participant_weekly_entry.py -g $GW -t 1 -s $START -e $END > ${{ env.START }}.json
      # make dynamic

      - name: 'Upload scrapped weekly entry'
        uses: actions/upload-artifact@v4
        with:
          name: weekly_entry
          path: LiveProject/${{ env.START }}.json

  upload:
    # Allow the job to fetch a GitHub ID token
      needs: scrap
      permissions:
        id-token: write
        contents: read
  
      runs-on: ubuntu-latest
      steps: 
        - id: 'checkout'
          uses: 'actions/checkout@v4'
          
        - id: 'auth'
          name: 'Authenticate to Google Cloud'
          uses: 'google-github-actions/auth@v2'
          with:
            create_credentials_file: true
            workload_identity_provider: projects/987818742353/locations/global/workloadIdentityPools/gh-fpl/providers/github
            service_account: league-analysis@fpl-analysis-tool.iam.gserviceaccount.com
            process_gcloudignore: false

        - name: Download outputted json
          uses: actions/download-artifact@v4
          with:
            name: weekly_entry
            path: LiveProject/${{ env.START }}.json
            
        - id: 'upload-folder'
          uses: 'google-github-actions/upload-cloud-storage@v2'
          with:
            path: LiveProject/${{ env.GW }}.json # modularize
            destination: 'wrapped_participants_entry'
    
