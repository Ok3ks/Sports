name: Fixtures & Gameweek
on:
  schedule:
    #Friday, Saturday, Sunday
    - cron: '*/10 11-18 * * 0'
    - cron: '*/10 12-20 * * 6'
    - cron: '*/10 19-22 * * 5'
    # Midweek games from february to May
    - cron: '*/10 19-22 * 2-5 2-4'

  push:
    paths:
      - '.github/workflows/fixbuild.yml' 
  workflow_dispatch:
    inputs:
      name:
        description: 'Update Fixtures/Result'
        default: 'Update Fixtures/Result'
        required: true
        type: string

jobs:
  fixtures:
    # Allow the job to fetch a GitHub ID token
    permissions:
      id-token: write
      contents: read

    runs-on: ubuntu-latest
      
    steps:
      - id: 'checkout'
        uses: 'actions/checkout@v4'
        with: 
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "LiveProject/.python-version"

      - name: Create virtualenv
        run: |
          which python
          python -m venv venv
          source venv/bin/activate
          pipx install poetry
          cd LiveProject
          poetry install --no-root
          which python

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          create_credentials_file: true
          workload_identity_provider: '${{secrets.WORKLOAD_IDENTITY_PROVIDERS }}'
          service_account: '${{ secrets.AUTH_SERVICE_ACCOUNT }}'
          process_gcloudignore: false
    
      - name: Obtain current gameweek script
        run: |
            source venv/bin/activate
            source init_env.sh
            cd LiveProject
            echo getting current gameweek
            GW=$(python -m src.utils)
            echo "GW=$GW" >> "$GITHUB_ENV"

      - name: 'Upload Fixtures'
        run: |
            source venv/bin/activate
            source init_env.sh
            cd LiveProject
            echo updating fixtures
            python src/db/update_season_fixture.py
            python src/gameview.py -f True -u True
            
      - name: 'Create Gameweek Report'
        run: |
            source venv/bin/activate
            source init_env.sh
            cd LiveProject
            echo ${{ env.GW }} report
            python src/db/update_player_information.py -ha 1
            python src/db/update_player_information.py -ha 2
            python src/db/update_gameweek_score.py -g ${{ env.GW }}
            python src/gameview.py -g ${{ env.GW }} -u True
