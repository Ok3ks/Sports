"""
GraphQL schema definitions.
"""

type Query {
  player(id: Int!, gameweek: Int!): Player!
  players(ids: [Int!]!, gameweek: Int!): [Player!]

  gameweekScore(gameweek: Int!): PlayerGameweekScore!
  gameviewReport: [PlayerGameweekScore!]!

  leagueWeeklyReport(leagueId: Int!, gameweek:Int!): LeagueWeeklyReport!
  seasonParticipantReport(season: String!, entryId: Int!): SeasonParticipantReport!

  gameViewReport(Gameweek:[Int!]): GameViewReport!
  Differential(gameweek:Int!): DifferentialPlayer
}


type Player {
  playerId: Int!
  info: PlayerInfo!
  gameweekScore: PlayerGameweekScore!
}

type DifferentialPlayer {
  players: [Int!]
}


type PlayerGameweekScore {
    playerId: Int!
    minutes: Int!
    goalsScored: Int!
    assists: Int!
    cleanSheets: Int!
    goalsConceded: Int!
    ownGoals: Int!
    penaltiesSaved: Int!
    penaltiesMissed: Int!
    yellowCards: Int!
    redCards: Int!
    saves: Int!
    bonus: Int!
    bps: Int!
    influence: Float!
    creativity: Float!
    threat: Float!
    ictIndex: Float!
    starts: Int!
    expectedGoals: Float!
    expectedAssists: Float!
    expectedGoalInvolvements: Float!
    expectedGoalsConceded: Float!
    totalPoints: Int!
    inDreamteam: Int!
    gameweek: Int!
}

type PlayerInfo {
    playerId: String!
    playerName: String!
    position: String!
    team:  String!
    half:  Int!
}

type gameviewReport {
    goals_scored: [Int!]
    total_points: [Int!]
    assists: [Int!]

}

type SeasonParticipantReport{
  rank: [GameweekHistory]
  totalPointsGained: [TotalPointsGained]
  nTransfers: Int
  captainPoints: [CaptainPoints]
  transferPointsGained: TransferPointsGained
}

type TotalPointsGained{
  gw: Int!
  totalPoints: Int!
}
type TransferPointDeltaRecord {
    gw: Int
    transferPointDelta: Int
    finalCaptainGameweekScore: Int
    captainGameweekScore:Int
    captainFixture: [Fixture]
    viceCaptainFixture: [Fixture]
    captainPlayerName: String!
    viceCaptainPlayerName: String!
    captainMinutes: Int
    viceCaptainMinutes: Int
}

type Fixture {
    homeDifficulty: Int
    awayDifficulty: Int
    home: String
    away: String
    homeGoals: Int
    awayGoals: Int
    code: Int
    gameweek: Int
    finished: Boolean
}

type CaptainPoints {
  gw: Int!,
  finalCaptainGameweekScore: Int!
  captainFixture: [Fixture]
  viceCaptainFixture: [Fixture]
  activeChip: String!
  captainPlayerName: String!
  viceCaptainPlayerName: String!
  captainGameweekScore: Int!
  viceCaptainGameweekScore: Int!
  captainMinutes: Int!
  viceCaptainMinutes: Int!
}


type TransferPointsGained {
  freehit: [TransferPointDeltaRecord]
  transfers: [TransferPointDeltaRecord]
  wildcard: [TransferPointDeltaRecord]
  bboost: [TransferPointDeltaRecord]
  max: [TransferPointDeltaRecord]
  min: [TransferPointDeltaRecord]
  tripleCap: [TransferPointDeltaRecord]
}

type GameweekHistory {
