[project]
name = "liveproject"
version = "0.1.0"
description = ""
authors = [
    {name = "ok3ks",email = "freelanceokeks@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "django (>=6.0.2,<7.0.0)",
    "ariadne-django (>=0.3.0,<0.4.0)",
    "gunicorn (>=25.0.3,<26.0.0)",
    "numpy (>=2.4.2,<3.0.0)",
    "pandas (>=3.0.0,<4.0.0)",
    "pymysql (>=1.1.2,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "argparse (>=1.4.0,<2.0.0)",
    "gevent (>=25.9.1,<26.0.0)",
    "sqlalchemy (>=2.0.46,<3.0.0)",
    "google-cloud-storage (>=3.9.0,<4.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
]

[tool.poetry.dependencies]
python = "^3.12"
django = "5.1"
django-livereload = "1.7"
django-cors-headers = "4.4.0"
ariadne = "^0.23.0"
ariadne-django = "^0.3.0"
gunicorn = "^23.0.0"
pandas = "^2.2.3"
numpy = "^2.1.2"
requests = "^2.32.3"
argparse = "^1.4.0"
gevent = "^24.11.1"
pytest = "^8.3.4"
sqlalchemy = "^2.0.38"
google-cloud-storage = "^3.1.0"


[tool.poetry.group.dev.dependencies]
ruff = "^0.9.6"
pytest = "^8.3.4"
marimo = "^0.21.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)"
]
